<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>IMFvsMI6 v4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#f4f6fa;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#app{max-width:900px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 10px}h1{font-size:22px;margin:0;letter-spacing:1px}#status{font-size:12px;color:#b8c4d6;text-align:right}canvas{display:block;width:100%;height:min(68vh,520px);background:#1b2634;border:1px solid #526176;border-radius:14px;touch-action:none}#hud{display:flex;justify-content:space-between;gap:10px;margin:8px 0;font-size:13px}#msg{color:#ffdf8b;min-height:20px;font-size:13px;margin:5px 0}#controls{display:grid;grid-template-columns:minmax(150px,.85fr) minmax(0,1.4fr);gap:12px;margin-top:8px;align-items:center}.stick-area{display:flex;align-items:center;justify-content:center;min-width:0}.stick{position:relative;width:min(42vw,210px);height:min(42vw,210px);max-width:210px;max-height:210px;min-width:145px;min-height:145px;border:2px solid #64748b;border-radius:50%;background:radial-gradient(circle,#34465d 0%,#253448 72%,#1b2634 100%);touch-action:none;user-select:none;overflow:hidden}.stick:before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#8293a8;transform:translate(-50%,-50%)}.stick-knob{position:absolute;left:50%;top:50%;width:42%;height:42%;border-radius:50%;transform:translate(-50%,-50%);background:linear-gradient(145deg,#91a8c2,#536b87);border:2px solid #d4deea;box-shadow:0 4px 10px #0006;pointer-events:none}.btn{border:1px solid #64748b;border-radius:12px;background:#273548;color:white;font-size:14px;font-weight:700;touch-action:none;user-select:none}.btn:active,.btn.active{background:#496987}.blank{visibility:hidden}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.actions button{min-height:54px}.attack{background:#713b42}.defend{background:#35577d}.evade{background:#34654e}.search{background:#665b37}.trap{background:#5b456f}.restart{background:#303744}@media(min-width:650px){#controls{grid-template-columns:260px 1fr}.stick{width:220px;height:220px}.actions button{min-height:62px}}@media(max-width:390px){#controls{grid-template-columns:minmax(135px,.8fr) minmax(0,1.2fr);gap:8px}.stick{min-width:132px;min-height:132px}.actions{gap:5px}.actions button{font-size:12px;min-height:50px}}
</style></head><body><div id="app"><header><h1>IMF <span style="color:#f0b45c">vs</span> MI6</h1><div id="status">試作 v4 · 横向き対応</div></header>
<canvas id="game" width="900" height="560" aria-label="ゲーム画面"></canvas><div id="hud"><span id="playerHud">IMF　体力 100</span><span id="enemyHud">MI6　体力 100</span></div><div id="msg">iPhoneを横向きにして探索。敵もアイテムを集めて脱出する！</div>
<div id="controls"><div class="stick-area"><div id="stick" class="stick" aria-label="移動スティック"><div id="stickKnob" class="stick-knob"></div></div></div><div class="actions"><button class="btn attack" id="attack">攻撃</button><button class="btn defend" id="defend">防御</button><button class="btn evade" id="evade">回避</button><button class="btn search" id="search">調べる / 拾う</button><button class="btn trap" id="trap">罠を設置</button><button class="btn restart" id="restart">リスタート</button></div></div>
<p style="font-size:11px;color:#9aa9bc;margin:10px 2px">試作 v3：横向き推奨・ドア移動・敵もアイテム探索。通信対戦は次段階で追加します。</p></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const msg=document.getElementById('msg');
const map={w:900,h:560,rooms:[{x:25,y:25,w:390,h:230,name:'ARCHIVE'},{x:485,y:25,w:390,h:230,name:'CONTROL'},{x:25,y:305,w:390,h:230,name:'LAB'},{x:485,y:305,w:390,h:230,name:'EXIT'}]};
let p,e,items,traps,keys={},battle=false,over=false,frame=0,score=0,guard=0,evading=0;
function reset(){p={x:100,y:130,hp:100,face:1,team:'IMF',color:'#4db4e8',items:0};e={x:730,y:410,hp:100,face:-1,team:'MI6',color:'#f07865',cool:0,stun:0,items:0,escaped:false};items=[{x:320,y:100,t:'FILE',got:false},{x:590,y:160,t:'KEY',got:false},{x:250,y:430,t:'CHIP',got:false}];traps=[];battle=false;over=false;frame=0;score=0;guard=0;evading=0;msg.textContent='iPhoneを横向きにして探索。敵もアイテムを集めて脱出する！';draw()}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function inRoom(x,y){return (x>=38&&x<=402&&y>=38&&y<=242)||(x>=498&&x<=862&&y>=38&&y<=242)||(x>=38&&x<=402&&y>=318&&y<=522)||(x>=498&&x<=862&&y>=318&&y<=522)}
function inCorridor(x,y){return (x>=415&&x<=485&&y>=90&&y<=470)||(x>=180&&x<=720&&y>=255&&y<=305)}
function blockedFurniture(x,y){return [[80,70,70,45],[300,165,70,45],[550,75,70,45],[760,175,70,45],[90,370,70,45],[320,460,70,45],[560,370,70,45]].some(([a,b,w,h])=>x>a-18&&x<a+w+18&&y>b-18&&y<b+h+18)}
function walkable(x,y){return (inRoom(x,y)||inCorridor(x,y))&&!blockedFurniture(x,y)}
function moveActor(a,dx,dy,speed){let nx=clamp(a.x+dx*speed,25,875),ny=clamp(a.y+dy*speed,25,535);if(walkable(nx,a.y))a.x=nx;if(walkable(a.x,ny))a.y=ny}
function roomId(a){if(a.x<415)return a.y<280?0:2;if(a.x>485)return a.y<280?1:3;return -1}
function move(dx,dy){if(over)return;let speed=battle?3.1:3.5;moveActor(p,dx,dy,speed);if(dx)p.face=Math.sign(dx);battle=roomId(p)>=0&&roomId(p)===roomId(e)&&dist(p,e)<76;draw()}
function say(s){msg.textContent=s}
function attack(){if(over)return;if(roomId(p)!==roomId(e)||dist(p,e)>86){say('敵と同じ部屋で近づいて攻撃しよう。');return}if(e.stun>0){say('敵はダウン中！');return}e.hp=Math.max(0,e.hp-(guard?8:18));e.stun=25;say('攻撃命中！ MI6の体力が減った。');if(e.hp<=0){over=true;say('MI6を撃退！探索を続けて脱出を目指そう。')}draw()}
function defend(){guard=24;say('防御態勢！しばらく攻撃ダメージを軽減。');draw()}
function evade(){if(over)return;evading=15;moveActor(p,-p.face,0,35);say('回避！距離を取った。');draw()}
function search(){if(over)return;let it=items.find(i=>!i.got&&dist(p,i)<42);if(it){it.got=true;p.items++;score++;say(it.t+'を入手！ アイテム '+p.items+'/3');if(p.items===3)say('必要なアイテムを全て入手！ EXITへ向かおう。');}else if(p.x>700&&p.y>390&&p.items>=3){over=true;say('脱出成功！ IMFのミッション完了！');}else say('近くに調べられる物がない。家具やアイテムに近づこう。');draw()}
function placeTrap(){if(over)return;if(traps.length>=3){say('罠は最大3個まで。');return}traps.push({x:p.x,y:p.y,life:900});say('罠を設置した！敵が近づくと作動。');draw()}
function tick(){if(over)return;frame++;if(guard>0)guard--;if(evading>0)evading--;
if(e.stun>0)e.stun--;
else {
  // MI6はIMFを追い続けず、未取得アイテムを探す。全取得後はEXITへ。
  let target=items.find(i=>!i.got);
  if(!target&&e.items<3)target={x:250,y:430,t:'CHIP'};
  if(e.items>=3)target={x:780,y:460,t:'EXIT'};
  if(target){let d=Math.hypot(target.x-e.x,target.y-e.y)||1;let vx=(target.x-e.x)/d,vy=(target.y-e.y)/d;
    // 通路や壁に当たる場合は、部屋のドア/中央通路を経由する。
    let waypoint=target;
    if(!inRoom(target.x,target.y)&&!inCorridor(target.x,target.y))waypoint={x:450,y:280};
    if(roomId(e)!==roomId(target)&&roomId(e)>=0&&roomId(target)>=0){
      if(roomId(e)===0||roomId(e)===2)waypoint={x:400,y:e.y<280?145:390};
      else if(roomId(e)===1||roomId(e)===3)waypoint={x:500,y:e.y<280?145:390};
      if(e.x>415&&e.x<485)waypoint={x:450,y:280};
      if(e.y>255&&e.y<305)waypoint={x:450,y:280};
    }
    let wd=Math.hypot(waypoint.x-e.x,waypoint.y-e.y)||1;
    moveActor(e,(waypoint.x-e.x)/wd,(waypoint.y-e.y)/wd,1.25);
    if(Math.abs(vx)>.1)e.face=Math.sign(vx);
    // アイテムを拾う
    let near=items.find(i=>!i.got&&dist(e,i)<25);
    if(near){near.got=true;e.items++;say('MI6が'+near.t+'を入手！');}
    if(e.items>=3&&e.x>700&&e.y>390){e.escaped=true;say('MI6が脱出した！ IMFも急ごう。')}
  }
  // 戦闘は同じ部屋で接近した時だけ。MI6が探索中に必ず攻撃することはない。
  let same=roomId(p)>=0&&roomId(p)===roomId(e),d=dist(p,e);
  battle=same&&d<76;
  if(battle&&d<48&&e.cool<=0){let damage=evading?0:(guard?4:8);p.hp=Math.max(0,p.hp-damage);e.cool=65;if(damage)say(guard?'敵の攻撃を防御！':'鉢合わせ！MI6が攻撃！');else say('攻撃を回避！');if(p.hp<=0){over=true;say('IMFがダウン！リスタートで再挑戦。')}}
  if(e.cool>0)e.cool--;
}
traps.forEach(t=>{t.life--;if(dist(t,e)<28&&e.stun<=0){e.stun=75;e.hp=Math.max(0,e.hp-8);t.life=0;say('MI6が罠にかかった！')} });traps=traps.filter(t=>t.life>0);
draw();requestAnimationFrame(tick)}
function draw(){ctx.clearRect(0,0,900,560);ctx.fillStyle='#172230';ctx.fillRect(0,0,900,560);
// rooms
map.rooms.forEach((r,i)=>{ctx.fillStyle=['#263849','#293b4b','#2b3a3e','#343a42'][i];ctx.fillRect(r.x,r.y,r.w,r.h);ctx.strokeStyle='#8192a7';ctx.lineWidth=4;ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.fillStyle='#aebed0';ctx.font='bold 15px system-ui';ctx.fillText(r.name,r.x+14,r.y+25)});
// corridor and furniture
ctx.fillStyle='#3c4653';ctx.fillRect(415,90,70,380);ctx.fillRect(180,255,540,50);ctx.fillStyle='#596775';[[80,70],[300,165],[550,75],[760,175],[90,370],[320,460],[560,370]].forEach(([x,y])=>{ctx.fillRect(x,y,70,45);ctx.strokeStyle='#9ca9b6';ctx.strokeRect(x,y,70,45)});
// exit
ctx.fillStyle=p.items>=3?'#4ed18a':'#b8a45b';ctx.fillRect(735,425,95,75);ctx.fillStyle='#101722';ctx.font='bold 16px system-ui';ctx.fillText('EXIT',758,468);ctx.font='12px system-ui';ctx.fillText(p.items+'/3',765,486);
items.forEach(i=>{if(!i.got){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(i.x,i.y,12,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3b2b13';ctx.font='bold 10px system-ui';ctx.fillText(i.t,i.x-13,i.y+4)}});
traps.forEach(t=>{ctx.fillStyle='#d88bff';ctx.beginPath();ctx.arc(t.x,t.y,11,0,Math.PI*2);ctx.fill();ctx.fillStyle='#26152f';ctx.fillText('!',t.x-3,t.y+4)});
function agent(a,label){ctx.save();ctx.translate(a.x,a.y);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,14,20,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(0,0,17,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111923';ctx.fillRect(-12,-7,24,8);ctx.fillStyle='#fff';ctx.fillRect(a.face>0?2:-10,-5,8,3);ctx.fillStyle='#e8edf4';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(label,0,-25);if(a.stun>0){ctx.fillStyle='#ffd166';ctx.fillText('STUN',0,31)}ctx.restore()}
agent(p,'IMF');agent(e,'MI6');ctx.fillStyle='#f4f6fa';ctx.font='bold 12px system-ui';ctx.textAlign='left';ctx.fillText('MI6 ITEMS '+e.items+'/3',690,20);
// HUD bars
ctx.fillStyle='#111923';ctx.fillRect(25,270,160,13);ctx.fillRect(715,270,160,13);ctx.fillStyle='#4db4e8';ctx.fillRect(25,270,160*p.hp/100,13);ctx.fillStyle='#f07865';ctx.fillRect(715,270,160*e.hp/100,13);
if(battle){ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText('⚔ BATTLE',450,286)}
if(over){ctx.fillStyle='rgba(5,10,16,.72)';ctx.fillRect(0,0,900,560);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 34px system-ui';ctx.fillText(p.hp<=0?'MISSION FAILED':'MISSION COMPLETE',450,270);ctx.font='18px system-ui';ctx.fillText('リスタートで再挑戦',450,310)}
document.getElementById('playerHud').textContent='IMF　体力 '+p.hp+'　アイテム '+p.items+'/3';document.getElementById('enemyHud').textContent='MI6　体力 '+e.hp+'　アイテム '+e.items+'/3';
}
const stick=document.getElementById('stick'),knob=document.getElementById('stickKnob');let stickPointer=null,stickX=0,stickY=0,stickTimer=null;
function setStick(ev){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=ev.clientX-cx,dy=ev.clientY-cy;const max=r.width*.29,len=Math.hypot(dx,dy);if(len>max){dx=dx/len*max;dy=dy/len*max}knob.style.left=`${50+dx/r.width*100}%`;knob.style.top=`${50+dy/r.height*100}%`;stickX=dx/max;stickY=dy/max}
function stopStick(ev){if(stickPointer!==null&&(ev.pointerId===undefined||ev.pointerId===stickPointer)){stickPointer=null;stickX=stickY=0;knob.style.left='50%';knob.style.top='50%';if(stickTimer){clearInterval(stickTimer);stickTimer=null}}}
stick.addEventListener('pointerdown',ev=>{ev.preventDefault();stickPointer=ev.pointerId;stick.setPointerCapture(ev.pointerId);setStick(ev);if(stickTimer)clearInterval(stickTimer);stickTimer=setInterval(()=>{if(Math.hypot(stickX,stickY)>.16)move(stickX,stickY)},55)});
stick.addEventListener('pointermove',ev=>{if(ev.pointerId===stickPointer){ev.preventDefault();setStick(ev)}});
['pointerup','pointercancel','lostpointercapture'].forEach(t=>stick.addEventListener(t,stopStick));
attackBtn();function attackBtn(){document.getElementById('attack').onclick=attack;document.getElementById('defend').onclick=defend;document.getElementById('evade').onclick=evade;document.getElementById('search').onclick=search;document.getElementById('trap').onclick=placeTrap;document.getElementById('restart').onclick=reset}
let canvasDown=false;canvas.addEventListener('pointerdown',ev=>{canvasDown=true;const r=canvas.getBoundingClientRect();const x=(ev.clientX-r.left)*900/r.width,y=(ev.clientY-r.top)*560/r.height;let dx=x-p.x,dy=y-p.y;let d=Math.hypot(dx,dy)||1;move(dx/d,dy/d)});canvas.addEventListener('pointerup',()=>canvasDown=false);
reset();requestAnimationFrame(tick);
</script></body></html>
